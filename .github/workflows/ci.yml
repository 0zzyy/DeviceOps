name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -project DeviceOps.xcodeproj -scheme DeviceOpsApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build
      - name: Unit Tests
        run: swift test
